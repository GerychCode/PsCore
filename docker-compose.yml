services:
  # ---------------------------------
  # BACKEND (NestJS)
  # ---------------------------------
  server:
    build:
      context: ./workCore-server # <--- ВИПРАВЛЕНО НАЗВУ ПАПКИ
      target: production
    container_name: nest_app_prod
    restart: unless-stopped
    ports:
      - "${APPLICATION_PORT:-3022}:3022"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Локальний час для логів і часу початку/кінця змін
      - TZ=${TZ:-Europe/Kyiv}
      # Перевизначаємо хости для роботи всередині мережі Docker
      - POSTGRES_HOST=postgres
      # Redis тепер вимагає пароль (див. .env → REDIS_PASSWORD)
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: sh -c "npx prisma db push && npm run start:prod"
    depends_on:
      - postgres
      - redis

  # ---------------------------------
  # FRONTEND (Next.js)
  # ---------------------------------
  client:
    build:
      context: ./work-core-client
      # production: сторінки збираються наперед (next build) і відкриваються
      # одразу. Для розробки з hot-reload поверніть target: development
      # і розкоментуйте volumes нижче.
      target: production
      args:
        - NEXT_PUBLIC_SERVER_HOST=${SERVER_IP:-127.0.0.1}
    container_name: next_client
    restart: unless-stopped
    ports:
      - "1489:3000"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Kyiv}
    # volumes:
    #   - ./work-core-client:/app
    #   - /app/node_modules
    depends_on:
      - server

  # ---------------------------------
  # DATABASE (PostgreSQL)
  # ---------------------------------
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Kyiv}
      - PGTZ=${TZ:-Europe/Kyiv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: прив'язка ЛИШЕ до loopback — БД не має бути доступна з мережі.
    # Для доступу ззовні використовуйте SSH-тунель. У проді краще прибрати зовсім.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  # ---------------------------------
  # CACHE (Redis)
  # ---------------------------------
  redis:
    image: redis:7
    container_name: redis_cache
    restart: unless-stopped
    # SECURITY: Redis тримає СЕСІЇ — без пароля будь-хто в мережі підробить сесію.
    # requirepass обов'язковий; appendonly зберігає дані між рестартами.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    # Прив'язка лише до loopback (не 0.0.0.0)
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: